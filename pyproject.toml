# 只放工具配置：skill-zh 以 Claude Code 插件的形式发布，不是 Python 包。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 翻译提示词是整段中文散文，按行宽硬拆反而难读
"skill_zh/translator.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skill_zh", "conftest"]
